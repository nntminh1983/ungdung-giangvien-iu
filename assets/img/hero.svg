  <rect x="476" y="168" width="64" height="40" rx="3" fill="#0E3B52"/>
  <path d="M478 190 Q486 172 494 190 T510 190 T526 190 T538 190" fill="none" stroke="#5BFF9C" stroke-width="2"/>
