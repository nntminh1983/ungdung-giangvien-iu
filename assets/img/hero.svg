    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2170"/><stop offset="1" stop-color="#14164F"/></linearGradient>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0" y="292" width="640" height="68" fill="#C9D9F2"/>
