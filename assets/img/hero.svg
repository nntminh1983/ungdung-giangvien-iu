  <text x="62" y="210" fill="#FFFFFF" font-family="Cambria Math, Times New Roman, serif" font-size="20" font-style="italic">Γ = (Z<tspan font-size="13" dy="4">L</tspan><tspan dy="-4"> − Z</tspan><tspan font-size="13" dy="4">0</tspan><tspan dy="-4">) / (Z</tspan><tspan font-size="13" dy="4">L</tspan><tspan dy="-4"> + Z</tspan><tspan font-size="13" dy="4">0</tspan><tspan dy="-4">)</tspan></text>
  <circle cx="318" cy="104" r="26" fill="none" stroke="#F6AD55" stroke-width="3"/><path d="M292 104 H344 M318 78 V130" stroke="#F6AD55" stroke-width="2"/>
